# Can the standard library's evented `Io` do sockets yet?
#
# Zinet takes its `Io` as a parameter, and the interesting implementation is an
# evented one: every task becomes a fiber rather than an OS thread. That is the
# configuration the threading model was designed for, so it is worth tracking how
# close the standard library is to supplying it.
#
# As of 0.17.0-dev.1476 it is not close, and the reason has moved. In 0.16 the
# backends did not compile. Now `Uring` compiles, and `Dispatch` compiles once one
# line in `Allocator.free` is fixed — but on both, `netListenIp`, `netAccept` and
# `netConnectIp` are wired to stubs that return `error.NetworkDown`. A framework
# whose whole job is sockets cannot use that.
#
# This probe asks the question the honest way: it tries to listen, connect, accept
# and receive with a deadline, which is the exact set of operations a Zinet
# connection needs. Failure here is expected and is not a Zinet regression, which
# is why the trigger is manual — this tracks upstream, not us.
name: zig master probe

on:
  workflow_dispatch:

jobs:
  evented:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Report the version under test
        run: zig version

      - name: Listen, connect, accept and receive on std.Io.Evented
        run: |
          set -euo pipefail
          cat > probe.zig <<'ZIG'
          const std = @import("std");
          const Io = std.Io;

          fn connectOnce(io: Io, address: Io.net.IpAddress) void {
              var stream = address.connect(io, .{ .mode = .stream }) catch return;
              defer stream.close(io);
              _ = stream.socket.send(io, &address, "ping") catch return;
          }

          // Instantiating is the point: naming the type does not force the
          // backend's function bodies to be analysed, and doing I/O is the point
          // beyond that, since a backend can compile with every operation stubbed.
          pub fn main() !void {
              var debug: std.heap.DebugAllocator(.{}) = .init;
              defer _ = debug.deinit();

              var ev: Io.Evented = undefined;
              try ev.init(debug.allocator(), .{});
              defer ev.deinit();
              const io = ev.io();

              var server = try Io.net.IpAddress.listen(
                  &.{ .ip4 = .loopback(0) },
                  io,
                  .{ .reuse_address = true },
              );
              defer server.deinit(io);
              const address = server.socket.address;

              var future = try io.concurrent(connectOnce, .{ io, address });
              defer future.await(io);

              const accepted = try server.accept(io);
              defer accepted.close(io);

              // The load-bearing one: `net_receive` is the only operation in
              // `std.Io.Operation` that can put a deadline on a socket read, which
              // is what lets Zinet give every connection one task and still notice
              // idle peers and cross-task work.
              var buffer: [64]u8 = undefined;
              const deadline = Io.Timestamp.now(io, .awake)
                  .addDuration(.fromSeconds(5))
                  .withClock(.awake);
              const incoming = try accepted.socket.receiveTimeout(
                  io,
                  &buffer,
                  .{ .deadline = deadline },
              );
              if (!std.mem.eql(u8, incoming.data, "ping")) return error.Mismatch;

              std.debug.print("evented io does sockets: {s}\n", .{@typeName(Io.Evented)});
          }
          ZIG
          zig run probe.zig
